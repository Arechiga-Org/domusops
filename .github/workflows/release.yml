name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Lets the job prove its identity to the npm registry, which is how it publishes: no npm token is
  # stored or read anywhere (specs/007-debt-paydown, contracts/release.md).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions in this workflow are pinned by commit, because this job holds the publishing
      # identity. The version is in the comment; update both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. pnpm hands the upload to
      # the npm CLI, so this is the npm that publishes.
      - name: Install an npm that can publish with a trusted identity
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
