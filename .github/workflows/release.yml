name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefer OIDC trusted publishing over a long-lived NPM_TOKEN —
          # npm is restricting 2FA-bypassing tokens (account changes Aug 2026,
          # publishing Jan 2027). See 00-BOOTSTRAP-RUNBOOK.md Phase 4.5.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
