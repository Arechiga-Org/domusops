name: ci
on:
  push:
    branches: [main]
  pull_request:
  # New Home Assistant releases land without any change here; the matrix must still notice.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # packages/bootstrap's tests need real sops and age binaries (pinned to the versions
      # research verified against), not mocks.
      - name: Install sops and age
        run: |
          curl -sSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod +x /usr/local/bin/sops
          curl -sSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # ha-bootstrap's own package.json script (packages/bootstrap/package.json) runs the same suite
  # again on macOS, per research R14: git's own hooks and SOPS/age behave the same, but the
  # skill's install instructions and default key paths differ by OS, and this is what proves it.
  bootstrap-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: brew install sops age
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domusops/bootstrap test

  # The container-based validate test (research R9) is excluded from the default `pnpm test`
  # (vitest.config.ts) since it needs Docker and a network pull of the pinned instance image;
  # ubuntu-latest has Docker preinstalled.
  bootstrap-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install sops and age
        run: |
          curl -sSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod +x /usr/local/bin/sops
          curl -sSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domusops/bootstrap run test:bootstrap:container

  # Constitution §8: the supported-version matrix is proven here, not hand-written in the README.
  # Each leg runs the smoke check (the eight steps of specs/005-sandbox-harness/contracts/run-result.md)
  # and the container tests on one channel, then uploads the machine-readable result. The beta leg
  # may fail without failing the workflow; stable and previous-stable may not (see sandbox-gate).
  # Nothing here prints the environment or a token.
  sandbox-matrix:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, previous-stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domusops/sandbox... build
      - name: Smoke check
        run: node packages/sandbox/dist/cli.js smoke --channel ${{ matrix.channel }} --result sandbox-result-${{ matrix.channel }}.json
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-result-${{ matrix.channel }}
          path: sandbox-result-${{ matrix.channel }}.json
          if-no-files-found: warn
      - name: Container tests
        if: ${{ !cancelled() }}
        env:
          DOMUSOPS_SANDBOX_CHANNEL: ${{ matrix.channel }}
        run: |
          # With no beta in progress there is nothing to start; the smoke result already says so.
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).outcome === "no-beta-in-progress" ? 0 : 1)' "sandbox-result-${{ matrix.channel }}.json" 2>/dev/null; then
            echo "No beta is in progress; the container tests have nothing to run."
            exit 0
          fi
          pnpm --filter @domusops/sandbox run test:container

  # One required check for branch protection: the matrix legs that must pass are stable and
  # previous-stable. The beta leg is informative. The table goes to the job summary.
  sandbox-gate:
    needs: sandbox-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domusops/sandbox... build
      - uses: actions/download-artifact@v4
        with:
          pattern: sandbox-result-*
          path: sandbox-results
          merge-multiple: true
      - name: Check the matrix
        run: node packages/sandbox/scripts/supported-versions.mjs --gate sandbox-results >> "$GITHUB_STEP_SUMMARY"
      - name: Require a successful matrix
        if: ${{ always() && needs.sandbox-matrix.result != 'success' }}
        run: |
          echo "The sandbox-matrix job ended as ${{ needs.sandbox-matrix.result }}." >&2
          exit 1
